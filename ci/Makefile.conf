# config/Makefile.conf using the tools of the buildtools folder (ci/setup_buildtools.sh copies it there).
# The paths are found from this file's location: config/ -> ../buildtools
BUILDTOOLS := $(abspath $(dir $(lastword $(MAKEFILE_LIST)))../buildtools)

# nolibgs_hello_worlds: build rules of the kernel hook (psyq/ holds empty stand-ins for the PsyQ libraries its
# common.mk lists, none is used, and sys/types.h from PSn00bSDK)
PSXDIR = $(BUILDTOOLS)/nolibgs_hello_worlds

# PSn00bSDK 0.24 (win32 release package with its GCC 12.3 toolchain)
PSN00BSDK = $(BUILDTOOLS)/psn00bsdk
