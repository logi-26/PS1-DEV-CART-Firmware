# Net Play lobby proxy (netplay_server_proxy, nginx-unprivileged): the only container with a published port. It passes
# the lobby port to the server on the sealed network, with the player's real address first (PROXY protocol: the
# server's limits per address). TCP only, nothing else; no delay added to the relay's small frames (tcp_nodelay).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
	worker_connections 512;
}

stream {
	resolver 127.0.0.11 valid=10s ipv6=off;		# Docker's names (the server's address after a restart)
	limit_conn_zone $binary_remote_addr zone=per_address:1m;
	tcp_nodelay on;

	server {										# The lobby and the games' relay frames
		listen 7031;
		set $lobby netplay_server:7031;
		proxy_pass $lobby;
		proxy_protocol on;
		proxy_connect_timeout 5s;
		proxy_timeout 120s;							# (the server pings every client every 3 s)
		limit_conn per_address 10;					# (the server's own limit is 8: a little room for closing ones)
	}
}
